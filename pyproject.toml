[project]
name = "rl-research-crypto"
version = "1.0.0"
description = "Recurrent PPO agent with a differential Sharpe reward for hourly Bitcoin perpetual futures trading"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "gymnasium>=1.0,<2.0",
    "numpy>=1.26",
    "torch>=2.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "agents*", "data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["backups", "data", "results", "experiments", ".venv"]
