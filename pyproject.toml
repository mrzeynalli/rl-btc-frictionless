[project]
name = "cryptorl"
version = "0.1.0"
description = "Crypto reinforcement learning: data collection, features, environments, agents"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "gymnasium>=1.0,<2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
