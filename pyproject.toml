[project]
name = "cryptorl"
version = "0.2.0"
description = "Hourly GRU-PPO on BTCUSDT perpetual futures: data, features, environment, agent"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "gymnasium>=1.0,<2.0",
    "numpy>=1.26",
    "torch>=2.2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# The current model is a flat set of modules under src/ so it can be read and
# run without package plumbing; the Binance collector stays a package because
# its modules import each other.  Run everything with PYTHONPATH=src.
[tool.setuptools]
py-modules = [
    "data", "env", "evaluate", "evaluation", "experiment", "features",
    "model", "ppo", "probe", "report", "signal_check", "train",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["collector*"]
